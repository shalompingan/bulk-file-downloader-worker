name = "bulk-file-downloader-license"
main = "worker.js"
compatibility_date = "2026-08-01"

# DODO_API_BASE is not secret -- safe to commit. Live: real purchases from
# this point on go through Dodo's production license API. (Was
# "https://test.dodopayments.com" during the end-to-end test on 2026-08-09,
# confirmed working -- test purchase, key delivered, activation succeeded in
# the actual extension.)
#
# No API key/secret is needed at all -- Dodo's license activate/validate
# endpoints are public by design (see docs.dodopayments.com), unlike Creem's
# which required a secret x-api-key header. One less thing to configure or
# leak.
[vars]
DODO_API_BASE = "https://live.dodopayments.com"
