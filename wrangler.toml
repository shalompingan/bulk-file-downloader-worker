name = "bulk-file-downloader-license"
main = "worker.js"
compatibility_date = "2026-08-01"

# DODO_API_BASE is not secret -- safe to commit. Points at Dodo Payments'
# test server while validating the new license-key flow; switch to
# "https://live.dodopayments.com" once ready to accept real purchases.
#
# No API key/secret is needed at all -- Dodo's license activate/validate
# endpoints are public by design (see docs.dodopayments.com), unlike Creem's
# which required a secret x-api-key header. One less thing to configure or
# leak.
[vars]
DODO_API_BASE = "https://test.dodopayments.com"
